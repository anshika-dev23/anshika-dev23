<svg width="600" height="600" viewBox="0 0 600 600"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120D2B"/>
      <stop offset="50%" stop-color="#4B1D73"/>
      <stop offset="100%" stop-color="#17113A"/>
    </linearGradient>

    <linearGradient id="main" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8A2FF"/>
      <stop offset="50%" stop-color="#9B5DE5"/>
      <stop offset="100%" stop-color="#6C4AB6"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#4ADE80"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="300" cy="300" r="275"
          fill="url(#bg)"
          stroke="#9B5DE5"
          stroke-width="6"/>

  <circle cx="300" cy="300" r="250"
          fill="none"
          stroke="#C8A2FF"
          stroke-opacity="0.18"
          stroke-width="2"/>

  <!-- Voice waves -->
  <path d="M125 245 Q95 300 125 355"
        fill="none"
        stroke="url(#cyan)"
        stroke-width="10"
        stroke-linecap="round"
        opacity="0.9"/>

  <path d="M155 220 Q115 300 155 380"
        fill="none"
        stroke="url(#cyan)"
        stroke-width="7"
        stroke-linecap="round"
        opacity="0.65"/>

  <path d="M475 245 Q505 300 475 355"
        fill="none"
        stroke="url(#cyan)"
        stroke-width="10"
        stroke-linecap="round"
        opacity="0.9"/>

  <path d="M445 220 Q485 300 445 380"
        fill="none"
        stroke="url(#cyan)"
        stroke-width="7"
        stroke-linecap="round"
        opacity="0.65"/>

  <!-- Microphone glow -->
  <circle cx="300" cy="255" r="105"
          fill="#9B5DE5"
          opacity="0.15"
          filter="url(#softGlow)"/>

  <!-- Microphone -->
  <rect x="255" y="145"
        width="90"
        height="170"
        rx="45"
        fill="url(#main)"
        stroke="#E9D5FF"
        stroke-width="5"
        filter="url(#glow)"/>

  <!-- Mic inner highlight -->
  <rect x="275" y="165"
        width="18"
        height="110"
        rx="9"
        fill="#F5F3FF"
        opacity="0.35"/>

  <!-- Microphone stand -->
  <path d="M215 255
           C215 325 250 360 300 360
           C350 360 385 325 385 255"
        fill="none"
        stroke="#E9D5FF"
        stroke-width="13"
        stroke-linecap="round"/>

  <line x1="300" y1="360"
        x2="300" y2="410"
        stroke="#E9D5FF"
        stroke-width="13"
        stroke-linecap="round"/>

  <line x1="250" y1="410"
        x2="350" y2="410"
        stroke="#E9D5FF"
        stroke-width="13"
        stroke-linecap="round"/>

  <!-- Heart / healthcare symbol -->
  <path d="M300 445
           C270 415 230 430 230 462
           C230 490 265 510 300 535
           C335 510 370 490 370 462
           C370 430 330 415 300 445Z"
        fill="url(#green)"
        stroke="#ECFDF5"
        stroke-width="4"
        opacity="0.95"/>

  <!-- Medical cross -->
  <rect x="288" y="447"
        width="24"
        height="58"
        rx="5"
        fill="#35145C"/>

  <rect x="271" y="464"
        width="58"
        height="24"
        rx="5"
        fill="#35145C"/>

  <!-- Rural landscape -->
  <path d="M90 440
           Q150 390 210 440
           Q260 475 300 445
           Q350 475 390 440
           Q450 390 510 440
           L510 485
           L90 485Z"
        fill="url(#green)"
        opacity="0.75"/>

  <!-- Fields -->
  <path d="M90 485 Q190 450 300 485 Q410 450 510 485 L510 505 L90 505Z"
        fill="#4ADE80"
        opacity="0.35"/>

  <!-- Village houses -->
  <path d="M125 415 L160 385 L195 415 V455 H125Z"
        fill="#C8A2FF"
        opacity="0.9"/>

  <path d="M405 415 L440 385 L475 415 V455 H405Z"
        fill="#C8A2FF"
        opacity="0.9"/>

  <!-- House doors -->
  <rect x="150" y="425" width="20" height="30" rx="3"
        fill="#35145C"/>

  <rect x="430" y="425" width="20" height="30" rx="3"
        fill="#35145C"/>

  <!-- Trees -->
  <circle cx="105" cy="390" r="22" fill="#4ADE80"/>
  <rect x="100" y="405" width="10" height="35" fill="#8B5E34"/>

  <circle cx="495" cy="390" r="22" fill="#4ADE80"/>
  <rect x="490" y="405" width="10" height="35" fill="#8B5E34"/>

  <!-- Connection / bridge -->
  <path d="M185 505
           Q300 450 415 505"
        fill="none"
        stroke="url(#cyan)"
        stroke-width="9"
        stroke-linecap="round"/>

  <!-- Connection nodes -->
  <circle cx="185" cy="505" r="10" fill="#67E8F9"/>
  <circle cx="300" cy="475" r="10" fill="#67E8F9"/>
  <circle cx="415" cy="505" r="10" fill="#67E8F9"/>

  <!-- Small signal dots -->
  <circle cx="205" cy="175" r="6" fill="#C8A2FF"/>
  <circle cx="395" cy="175" r="6" fill="#67E8F9"/>
  <circle cx="225" cy="150" r="4" fill="#A7F3D0"/>
  <circle cx="375" cy="150" r="4" fill="#C8A2FF"/>

</svg>
